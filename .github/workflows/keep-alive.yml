name: Keep Render backend warm

# Render's free web service tier spins down after 15 minutes of no
# inbound traffic, so the first request after a gap eats a 30-50s cold
# start (or can briefly fail outright while the container is still
# booting). Pinging the health endpoint well inside that 15-minute
# window keeps it warm without needing a paid plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -m 30 https://prox-vulcan-agent-api.onrender.com/api/health || echo "ping failed (backend may have been mid cold-start) — not fatal"
