services:
  - type: web
    name: prox-vulcan-agent-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w server
    startCommand: node server/dist/index.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PROX_MODEL
        value: claude-sonnet-5

  - type: web
    name: prox-vulcan-agent-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: prox-vulcan-agent-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
